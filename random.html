<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Image</title>

    <!-- Discord embed tags. Discord does NOT run JavaScript, so this image is the same on every paste. -->
    <!-- Set it to a REAL file in your repo (open the URL in a browser to check it loads). -->
    <meta property="og:title" content="Random Image" />
    <meta property="og:description" content="Click to open a random image!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://raw.githubusercontent.com/LazyDev20/Home/main/images/CHANGE-ME.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/LazyDev20/Home/main/images/CHANGE-ME.jpg" />

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #aaa;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        #status { position: absolute; font-size: 14px; }
    </style>
</head>
<body>

    <div id="status">Loading…</div>
    <img id="random-img" alt="Random image" />

    <script>
        const GITHUB_USERNAME = "LazyDev20";
        const GITHUB_REPO     = "Home";
        const BRANCH          = "main";
        const FOLDER_PATH     = "images";   // change to "images2" if that's your folder name

        const validExtensions = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.avif'];
        const CACHE_KEY = `imgs:${GITHUB_USERNAME}/${GITHUB_REPO}/${FOLDER_PATH}`;
        const status = document.getElementById("status");
        const el = document.getElementById("random-img");

        async function getImages() {
            try {
                const c = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "null");
                if (c && Date.now() - c.t < 10 * 60 * 1000) return c.names;
            } catch (e) {}

            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FOLDER_PATH}?ref=${BRANCH}`;
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);
            const files = await response.json();

            const names = files
                .filter(f => f.type === "file" && validExtensions.some(ext => f.name.toLowerCase().endsWith(ext)))
                .map(f => f.name);

            try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), names })); } catch (e) {}
            return names;
        }

        async function loadRandomImage() {
            try {
                const names = await getImages();
                if (!names.length) { status.textContent = `No images found in "${FOLDER_PATH}".`; return; }

                const name = names[Math.floor(Math.random() * names.length)];
                el.onload = () => { status.style.display = "none"; el.style.display = "block"; };
                el.onerror = () => { status.textContent = "Image failed to load. Refresh to try another."; };
                el.src = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/${BRANCH}/${FOLDER_PATH}/${encodeURIComponent(name)}`;
            } catch (error) {
                status.textContent = "Could not load images: " + error.message;
                console.error(error);
            }
        }

        loadRandomImage();
    </script>
</body>
</html>
