<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Image</title>

    <!-- Discord Embed Meta Tags (Forces a Large Image Card) -->
    <meta property="og:title" content="Random Image" />
    <meta property="og:description" content="Click to open a random image!" />
    <meta property="og:type" content="website" />
    
    <!-- CRITICAL: Change 'YOUR-PREVIEW-IMAGE.jpg' to a real image filename inside your 'images' folder -->
    <meta property="og:image" content="https://raw.githubusercontent.com/LazyDev20/Home/main/images/YOUR-PREVIEW-IMAGE.jpg" />
    
    <!-- These two tags force Discord to display the image nicely as a big card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/LazyDev20/Home/main/images/YOUR-PREVIEW-IMAGE.jpg" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
    </style>
</head>
<body>

    <img id="random-img" alt="Random Image" />

    <script>
        const GITHUB_USERNAME = "LazyDev20";
        const GITHUB_REPO = "Home";
        const FOLDER_PATH = "images";

        const validExtensions = ['.png', '.jpg', '.jpeg', '.gif', '.webp'];
        let cachedImages = [];

        async function loadRandomImage() {
            try {
                if (cachedImages.length === 0) {
                    const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;
                    const response = await fetch(apiUrl);
                    const files = await response.json();
                    
                    cachedImages = files.filter(file => {
                        if (file.type !== "file") return false;
                        const lowerName = file.name.toLowerCase();
                        return validExtensions.some(ext => lowerName.endsWith(ext));
                    });
                }

                if (cachedImages.length > 0) {
                    const randomIndex = Math.floor(Math.random() * cachedImages.length);
                    const selectedFile = cachedImages[randomIndex];
                    
                    const el = document.getElementById("random-img");
                    el.src = `./${FOLDER_PATH}/${encodeURIComponent(selectedFile.name)}`;
                    el.style.display = "block";
                }
            } catch (error) {
                console.error("Failed to load random image", error);
            }
        }

        loadRandomImage();
    </script>
</body>
</html>
